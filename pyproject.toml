[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sms-providers"
version = "0.1.0"
description = "Unified Python interface for SMS activation services (HeroSMS, OnlineSim and any sms-activate compatible provider)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sergey" }]
keywords = ["sms", "sms-activate", "otp", "virtual-numbers", "hero-sms", "onlinesim", "2fa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/solovey1/unified-sms-activate"
Changelog = "https://github.com/solovey1/unified-sms-activate/blob/main/CHANGELOG.md"
Issues = "https://github.com/solovey1/unified-sms-activate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sms_providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
